# -- Image name and version
image:
  pullPolicy: IfNotPresent
  repository: jaegertracing/jaeger
  tag: 2.9.0

# -- Custom service name
# @default -- .Release.Name
serviceName:

# -- Jaeger ports
ports:
  http: 16686
  telemetry: 4318

ingress:
  # -- Enable ingress
  enabled: true
  # -- Ingress name
  name: jaeger
  # -- Domain
  domain: romanow-alex.ru

metrics:
  enabled: false
  storage:
    type: prometheus
    prometheus:
      endpoint: http://prometheus:9090
      normalize_calls: true
      normalize_duration: true

traces:
  storage:
    type: memory
    elasticsearch:
      # -- Elastic address
      endpoint: http://elasticsearch:9200
      # -- Elastic username (optional)
      username: logging
      # -- Elastic password (optional)
      password: qwerty
    prometheus:
      memory:
        max_traces: 30000

resources:
  # -- Requested resources
  requests:
    cpu: 300m
    memory: 1024Mi
  # -- Limited resources
  limits:
    cpu: 300m
    memory: 1024Mi
